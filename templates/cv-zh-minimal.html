<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
    color: #1a1a1a; font-size: 13px; line-height: 1.62;
    padding: 30px 38px;
  }
  .header { border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 14px; }
  .name { font-size: 24px; font-weight: 700; color: #2c3e50; letter-spacing: 1px; }
  .title { font-size: 14px; color: #555; margin-top: 3px; }
  .contact { font-size: 12px; color: #555; margin-top: 7px; }
  .contact span { margin-right: 16px; white-space: nowrap; }
  h2 {
    font-size: 14px; font-weight: 700; color: #2c3e50;
    border-left: 4px solid #2c3e50; padding-left: 8px;
    margin: 15px 0 8px;
  }
  .summary { text-align: justify; }
  .item { margin-bottom: 11px; }
  .item-head { display: flex; justify-content: space-between; font-weight: 600; }
  .item-head .right { color: #777; font-weight: 400; font-size: 12px; }
  .item-sub { color: #555; font-size: 12px; margin: 2px 0 4px; }
  .item-desc { color: #444; font-size: 12px; margin: 3px 0 5px; text-align: justify; }
  .item ul { margin-left: 16px; }
  .item ul li { margin-bottom: 2px; font-size: 12.5px; }
  .skills-row { margin-bottom: 4px; }
  .skills-cat { font-weight: 600; color: #2c3e50; }
  .interests { color: #444; font-size: 12.5px; }
  .core-capabilities { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .core-tag {
    background: #eef6ff; color: #1d4ed8;
    border-radius: 4px; padding: 3px 10px;
    font-size: 12px; display: inline-block;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="name">{{NAME}}</div>
    <div class="title">{{TITLE}}</div>
    <div class="contact">{{CONTACT}}</div>
  </div>

  <h2>个人总结</h2>
  <div class="summary">{{SUMMARY}}</div>

  <h2>核心能力</h2>
  <div class="core-capabilities">
    {{CORE}}
  </div>

  <h2>工作经历</h2>
  {{EXPERIENCE}}

  <h2>项目经历</h2>
  {{PROJECTS}}

  <h2>教育背景</h2>
  {{EDUCATION}}

  <h2>专业技能</h2>
  {{SKILLS}}

  {{INTERESTS}}
</body>
</html>
