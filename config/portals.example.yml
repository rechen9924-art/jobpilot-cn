# jobpilot-cn 职位发现配置
# 用法：复制为 config/portals.yml 后按需修改。
#
# ⚠️ 合规警示（重要）
# 国内招聘平台（BOSS直聘 / 猎聘 / 智联招聘 / 前程无忧 / 拉勾 / 牛客 / 脉脉）
# 普遍强反爬、需要登录态，且用户协议明确禁止自动化抓取。
# 本项目【不提供】登录态爬取配置。仅建议用公开搜索方式发现职位，
# 任何登录态 / 绕过反爬的抓取风险自负，并遵守各平台 ToS 与当地法律。

search:
  # 岗位关键词过滤（按你的目标岗位调整）
  title_filter:
    positive:
      - "产品"
      - "运营"
      - "项目经理"
      - "数据分析"
      - "外贸"
      - "海外"
      - "销售"
      - "商务"
    negative:        # 命中则排除
      - "实习"
      - "兼职"
      - "外包"
  locations:
    - "上海"
    - "杭州"
    - "北京"
    - "深圳"

# 国内公开职位渠道（仅作人工 / 公开搜索参考，非自动化抓取目标）
platforms:
  - name: "BOSS直聘"
    note: "直聊为主，需登录；禁止自动化，建议手动搜索 + 直聊"
  - name: "猎聘"
    note: "中高端 / 社招、猎头多；需登录"
  - name: "智联招聘"
    note: "综合 / 传统行业"
  - name: "前程无忧"
    note: "综合 / 传统行业"
  - name: "拉勾"
    note: "互联网岗位"
  - name: "牛客"
    note: "校招 / 技术岗"
  - name: "脉脉"
    note: "内推 / 人脉网络"
